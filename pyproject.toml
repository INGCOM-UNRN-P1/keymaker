[project]
name = "keymaker"
version = "0.2.0"
description = "Gestor de cifrado autenticado, integridad y desbloqueo temporal para paquetes de examen (.ripkg.enc)"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Martín René Vilugrón", email = "martinvilu@gmail.com"}
]
maintainers = [
    {name = "Programación I [B6003] - UNRN Andina"}
]
requires-python = ">=3.11"
keywords = ["education", "c-programming", "pedagogical-tools", "unrn"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "cryptography>=43.0.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    # Núcleo común del ecosistema (N-ECO-14): contrato de línea de comandos y textos en español.
    "yutani @ git+https://github.com/INGCOM-UNRN-P1/yutani@e4c8e1050e5dd87a930c5404aba6b65d1be1665a",
]

[project.urls]
Homepage = "https://github.com/INGCOM-UNRN-P1/keymaker"
Repository = "https://github.com/INGCOM-UNRN-P1/keymaker.git"
Issues = "https://github.com/INGCOM-UNRN-P1/keymaker/issues"

[project.scripts]
keymaker = "keymaker.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
# PEP 735: `uv sync` a secas lo instala; como extra opcional hacía falta `--extra dev`.
dev = [
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.metadata]
# yutani es una referencia directa a git (nunca por nombre en PyPI).
allow-direct-references = true
